name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.3"

      - name: Build
        run: lua buildLT9.lua

      - name: Verify output
        run: test -f build/Il2CppGG.lua

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Il2CppGG.lua
